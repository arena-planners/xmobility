[project]
name = "arena_planners_xmobility"
version = "0.0.0"
description = "X-Mobility planner adapter for arena_planners bridge."
requires-python = ">=3.10"
dependencies = [
    "arena_planners",
    "torch>=2.14",
    "transformers==4.48.1",
    "gin-config==0.5.0",
    "einops>=0.7",
    "diffusers>=0.29",
    "huggingface_hub>=0.20,<1.0",
    "safetensors",
    "numpy",
    "pyyaml",
]

[tool.uv.sources]
arena_planners = { git = "https://github.com/arena-planners/arena_planners.git", branch = "jazzy", subdirectory = "arena_planners" }

[tool.setuptools]
packages = []
py-modules = []

[tool.ruff]
line-length = 120
extend-exclude = ["xmobility_model"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["xmobility_model"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
